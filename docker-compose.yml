services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - crm_net
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: crm-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - crm_net
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: crm-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: cHM5m7WyFm0Q95wLZjvX0Y4X3KhRf5NOroot
      MARIADB_DATABASE: laravel_crm
      MARIADB_USER: crm_user
      MARIADB_PASSWORD: cHM5m7WyFm0Q95wLZjvX0Y4X3KhRf5NO
    volumes:
      - crm_db_data:/var/lib/mysql
    networks:
      - crm_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  crm_net:
    driver: bridge

volumes:
  crm_db_data:
